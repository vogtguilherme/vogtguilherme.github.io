---
layout: default
title: Projects
permalink: /projects/
---

<section class="section">
  <h2>Projects</h2>
  <div class="project-grid">
    {% for project in site.data.projects %}
    <article class="project-card">
      <h3>{{ project.title }}</h3>
      <p>{{ project.description }}</p>
      {% if project.tags %}
      <ul class="tags">
        {% for tag in project.tags %}<li>{{ tag }}</li>{% endfor %}
      </ul>
      {% endif %}
      <a class="project-link" href="{{ '/projects/' | append: project.slug | append: '/' | relative_url }}">View project &rarr;</a>
    </article>
    {% endfor %}
  </div>
</section>
