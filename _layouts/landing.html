<!DOCTYPE html>
<html lang="en">
<head>
  <style>html { background: #000; }</style>
  <script>
    // The landing is shown once per browser session; afterwards go straight to home.
    try {
      if (sessionStorage.getItem("landingSeen")) {
        location.replace("{{ '/home/' | relative_url }}");
      } else {
        sessionStorage.setItem("landingSeen", "1");
      }
    } catch (e) {}
  </script>
{% include head.html %}
</head>
<body>
  {{ content }}
</body>
</html>
